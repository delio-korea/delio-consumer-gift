  <text x="70" y="140" fill="#173c32" font-family="serif" font-size="48" font-weight="600">델리오 선물 패키지</text>
  <text x="70" y="178" fill="#52615a" font-family="sans-serif" font-size="20">받는 순간까지 안전하고 정성스럽게</text>
  <rect x="55" y="220" width="690" height="590" fill="#ebe5da"/>
  <image x="78" y="245" width="645" height="540" preserveAspectRatio="xMidYMid slice" href="delivery-outer-box.png"/>
  <path d="M430 470H770V390H875" fill="none" stroke="#b28c45" stroke-width="3"/><circle cx="430" cy="470" r="7" fill="#b28c45"/>
  <text x="890" y="382" fill="#173c32" font-family="serif" font-size="27">견고한 외부 배송 박스</text>
  <text x="890" y="420" fill="#657069" font-family="sans-serif" font-size="17">선물 상자를 한 번 더 안전하게 보호합니다.</text>
  <rect x="785" y="220" width="360" height="340" fill="#ebe5da"/>
  <image x="805" y="240" width="320" height="300" preserveAspectRatio="xMidYMid slice" href="gift-inner-divider.png"/>
  <path d="M955 540V600H1155" fill="none" stroke="#b28c45" stroke-width="3"/><circle cx="955" cy="540" r="7" fill="#b28c45"/>
  <text x="1170" y="598" fill="#173c32" font-family="serif" font-size="26">내부 칸막이 보호 구조</text>
  <rect x="1170" y="220" width="370" height="250" fill="#ebe5da"/>
  <image x="1190" y="238" width="330" height="214" preserveAspectRatio="xMidYMid slice" href="delio-bojagi-red.png"/>
  <path d="M1350 450V505H1535" fill="none" stroke="#b28c45" stroke-width="3"/><circle cx="1350" cy="450" r="7" fill="#b28c45"/>
  <text x="1170" y="555" fill="#173c32" font-family="serif" font-size="26">정갈한 보자기 포장</text>
  <rect x="785" y="620" width="300" height="190" fill="#ebe5da"/>
  <image x="800" y="635" width="270" height="160" preserveAspectRatio="xMidYMid meet" href="delio-thankyou-card.png"/>
  <path d="M1080 710H1150" stroke="#b28c45" stroke-width="3"/><circle cx="1080" cy="710" r="7" fill="#b28c45"/>
  <text x="1170" y="700" fill="#173c32" font-family="serif" font-size="26">감사 카드 동봉</text>
  <text x="1170" y="738" fill="#657069" font-family="sans-serif" font-size="17">선물의 마음을 카드에 담아 함께 보냅니다.</text>
  <text x="70" y="850" fill="#173c32" font-family="serif" font-size="25">과일별 개별 완충망</text>
  <text x="290" y="850" fill="#657069" font-family="sans-serif" font-size="17">과일 하나하나를 안전하게 보호합니다.</text>
